[package]
name = "dv-setup"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "The setup window the dv apps' installers share"
repository = "https://github.com/ksanadv/dv-setup"

[features]
# the releases on GitHub (`net`): WinHTTP and BCrypt, which only the dv apps' suite setup needs
net = ["windows/Win32_Networking_WinHttp", "windows/Win32_Security_Cryptography"]

[dependencies]
winreg = "0.56.0"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
